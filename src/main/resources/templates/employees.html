<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhân viên - Hệ thống Phiếu Lương</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img th:src="@{/images/logo.png}" alt="MV House Logo" style="width:44px;height:44px;object-fit:contain;border-radius:6px;">
            <div>
                <div class="sidebar-logo-title">MV House</div>
                <div class="sidebar-logo-sub">v1.0.0</div>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a th:href="@{/dashboard}" class="nav-item" id="nav-dashboard"><span class="nav-icon">📊</span> Dashboard</a>
            <a th:href="@{/employees}" class="nav-item active" id="nav-employees"><span class="nav-icon">👥</span> Nhân viên</a>
            <a th:href="@{/salary}" class="nav-item" id="nav-salary"><span class="nav-icon">📋</span> Phiếu lương</a>
        </nav>
        <div class="sidebar-footer">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn-logout">⏻ Đăng xuất</button>
            </form>
        </div>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <div>
                <h1 class="page-title">Quản lý nhân viên</h1>
                <p class="page-sub">Thêm, sửa, xóa thông tin nhân viên</p>
            </div>
            <button class="btn btn-primary" onclick="showModal('addModal')" id="btnAddEmployee">
                + Thêm nhân viên
            </button>
        </div>

        <!-- Alerts -->
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <!-- Search -->
        <div class="card">
            <div class="card-body">
                <form th:action="@{/employees}" method="get" class="search-form">
                    <input type="text" name="search" placeholder="🔍 Tìm kiếm theo tên, mã NV, email..."
                           th:value="${search}" class="search-input" id="searchInput">
                    <button type="submit" class="btn btn-primary">Tìm kiếm</button>
                    <a th:href="@{/employees}" class="btn btn-outline">Xóa lọc</a>
                </form>
            </div>
        </div>

        <!-- Employee Table -->
        <div class="card">
            <div class="card-header">
                <h3>👥 Danh sách nhân viên (<span th:text="${#lists.size(employees)}">0</span>)</h3>
            </div>
            <div class="card-body no-pad">
                <table class="data-table">
                    <thead>
                        <tr>

                            <th>Họ tên</th>
                            <th>CCCD</th>
                            <th>Email</th>
                            <th>Phòng ban</th>
                            <th>Chức vụ</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="emp : ${employees}">

                            <td>
                                <div class="emp-cell">
                                    <div class="emp-avatar" th:text="${#strings.substring(emp.fullName, 0, 1)}">A</div>
                                    <span th:text="${emp.fullName}">—</span>
                                </div>
                            </td>
                            <td th:text="${emp.identityCard}">—</td>
                            <td th:text="${emp.email}">—</td>
                            <td th:text="${emp.department ?: '—'}">—</td>
                            <td th:text="${emp.position ?: '—'}">—</td>
                            <td class="action-cell">
                                <button class="btn btn-sm btn-outline"
                                        th:data-id="${emp.id}"

                                        th:data-name="${emp.fullName}"
                                        th:data-email="${emp.email}"
                                        th:data-cccd="${emp.identityCard}"
                                        th:data-dept="${emp.department ?: ''}"
                                        th:data-pos="${emp.position ?: ''}"
                                        th:data-basic="${emp.basicSalary ?: 0}"
                                        onclick="editEmployee(this.getAttribute('data-id'), this.getAttribute('data-name'), this.getAttribute('data-email'), this.getAttribute('data-cccd'), this.getAttribute('data-dept'), this.getAttribute('data-pos'), this.getAttribute('data-basic'))">
                                    ✏ Sửa
                                </button>
                                <form th:action="@{/employees/delete/{id}(id=${emp.id})}" method="post" style="display:inline"
                                      onsubmit="confirmForm(event, 'Xác nhận xóa nhân viên này?', 'danger')">
                                    <button type="submit" class="btn btn-sm btn-danger">🗑 Xóa</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(employees)}">
                            <td colspan="6" class="empty-cell">Chưa có nhân viên nào</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="addModal">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalTitle">Thêm nhân viên mới</h3>
            <button class="modal-close" onclick="hideModal('addModal')">✕</button>
        </div>
        <form th:action="@{/employees/save}" method="post" th:object="${employeeDto}" onsubmit="return cleanMoneyInputs()">
            <input type="hidden" id="empId" name="id">
            <div class="modal-body">
                <div class="form-row">

                    <div class="form-group">
                        <label>Họ và tên <span class="required">*</span></label>
                        <input type="text" id="empName" name="fullName" placeholder="Nguyễn Văn A" class="form-input" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Email <span class="required">*</span></label>
                        <input type="email" id="empEmail" name="email" placeholder="email@company.com" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label>CCCD <span class="required">*</span></label>
                        <input type="text" id="empCccd" name="identityCard" placeholder="Số CCCD (dùng làm mật khẩu file PDF)" class="form-input" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Phòng ban</label>
                        <select id="empDept" name="department" class="form-select">
                            <option value="">-- Chọn phòng ban --</option>
                            <option value="Kỹ thuật">Kỹ thuật</option>
                            <option value="3D">3D</option>
                            <option value="Nội thất">Nội thất</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Chức vụ</label>
                        <input type="text" id="empPos" name="position" placeholder="Developer, Manager, ..." class="form-input">
                    </div>
                    <div class="form-group">
                        <label>Lương cơ bản <span class="required">*</span></label>
                        <input type="text" id="empBasicSalary" name="basicSalary" placeholder="VD: 5.000.000" class="form-input money-input" oninput="formatCurrency(this)" required>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="hideModal('addModal')">Hủy</button>
                <button type="submit" class="btn btn-primary" id="saveEmpBtn">💾 Lưu nhân viên</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:src="@{/js/app.js}"></script>
<script>
function editEmployee(id, name, email, cccd, dept, pos, basic) {
    document.getElementById('modalTitle').textContent = 'Chỉnh sửa nhân viên';
    document.getElementById('empId').value = id;
    document.getElementById('empName').value = name;
    document.getElementById('empEmail').value = email;
    document.getElementById('empCccd').value = cccd;
    document.getElementById('empDept').value = dept;
    document.getElementById('empPos').value = pos;
    let b = basic || 0;
    document.getElementById('empBasicSalary').value = parseInt(b, 10).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    showModal('addModal');
}

function formatCurrency(input) {
    let val = input.value.replace(/\D/g, '');
    if (val === '') val = '0';
    input.value = parseInt(val, 10).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

function cleanMoneyInputs() {
    document.querySelectorAll('.money-input').forEach(input => {
        input.value = input.value.replace(/\./g, '');
    });
    return true;
}
</script>
</body>
</html>
