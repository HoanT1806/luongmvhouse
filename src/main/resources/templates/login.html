<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Hệ thống Phiếu Lương</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, transparent 70%);
            top: -200px; left: -200px;
            animation: float 8s ease-in-out infinite;
        }
        body::after {
            content: '';
            position: absolute;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(16,185,129,0.1) 0%, transparent 70%);
            bottom: -150px; right: -150px;
            animation: float 10s ease-in-out infinite reverse;
        }
        @keyframes float { 0%,100%{transform:translate(0,0)} 50%{transform:translate(30px,-30px)} }

        .login-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 48px 44px;
            width: 420px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            position: relative;
            z-index: 1;
            animation: slideUp 0.6s ease;
        }
        @keyframes slideUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }

        .logo-wrap { text-align: center; margin-bottom: 32px; }
        .logo-icon {
            width: 80px; height: 80px;
            background: rgba(255,255,255,0.9);
            border-radius: 18px;
            display: inline-flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 25px rgba(99,102,241,0.4);
            margin-bottom: 16px;
            padding: 8px;
        }
        .logo-icon img { width: 100%; height: 100%; object-fit: contain; }
        .logo-wrap h1 { color: #fff; font-size: 22px; font-weight: 700; }
        .logo-wrap p { color: rgba(255,255,255,0.5); font-size: 13px; margin-top: 4px; }

        .form-group { margin-bottom: 20px; }
        label { display: block; color: rgba(255,255,255,0.7); font-size: 13px; font-weight: 500; margin-bottom: 8px; }
        input[type=text], input[type=password] {
            width: 100%; padding: 12px 16px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }
        input:focus { border-color: #6366f1; background: rgba(99,102,241,0.1); box-shadow: 0 0 0 3px rgba(99,102,241,0.2); }
        input::placeholder { color: rgba(255,255,255,0.3); }

        .btn-login {
            width: 100%; padding: 13px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white; border: none; border-radius: 12px;
            font-size: 15px; font-weight: 600; cursor: pointer;
            transition: all 0.3s; margin-top: 8px;
            font-family: 'Inter', sans-serif;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(99,102,241,0.5); }
        .btn-login:active { transform: translateY(0); }

        .alert {
            padding: 12px 16px; border-radius: 10px;
            font-size: 13px; margin-bottom: 20px;
        }
        .alert-error { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
        .alert-success { background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.3); color: #6ee7b7; }

        .hint { color: rgba(255,255,255,0.35); font-size: 12px; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="logo-wrap">
        <div class="logo-icon"><img th:src="@{/images/logo.png}" alt="MV House Logo"></div>
        <h1>MV House</h1>
        <p>Hệ thống quản lý & gửi phiếu lương</p>
    </div>

    <div th:if="${errorMsg}" class="alert alert-error">
        ⚠ <span th:text="${errorMsg}"></span>
    </div>
    <div th:if="${logoutMsg}" class="alert alert-success">
        ✓ <span th:text="${logoutMsg}"></span>
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Tên đăng nhập</label>
            <input type="text" id="username" name="username" placeholder="admin" autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button type="submit" class="btn-login" id="loginBtn">Đăng nhập →</button>
    </form>

    <!-- <p class="hint">💡 Demo: admin / admin123</p> -->
</div>
</body>
</html>
